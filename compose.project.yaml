# Dev stack for ONE Genropy project.
#
# The same file serves every project: only the --env-file changes. `name`
# namespaces containers, network and volumes per project.
#
# Normally driven by ./gnrdev:
#   docker compose --env-file projects/<project>.env -f compose.project.yaml up -d

name: gnr-${GNR_PROJECT}

services:
  db:
    image: postgres:${POSTGRES_TAG:-18}
    container_name: gnr-${GNR_PROJECT}-db
    hostname: gnr-${GNR_PROJECT}-db
    environment:
      POSTGRES_USER: ${GNR_DB_USER:-genro}
      POSTGRES_PASSWORD: ${GNR_DB_PASSWORD:-genro}
      POSTGRES_DB: ${GNR_DB_NAME}
    volumes:
      # PostgreSQL 18+ wants a single mount at /var/lib/postgresql and keeps the
      # data in a subdirectory; mounting .../data directly makes it refuse to
      # start. Older versions need .../data instead: gnrdev swaps it in with
      # compose.pg-legacy.yaml. See docs/troubleshooting.md.
      - pgdata:/var/lib/postgresql
    ports:
      # Published so external clients can reach it. Set GNR_PORT_DB=0 in the
      # project .env to keep it unpublished.
      - "${GNR_PORT_DB:-9200}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GNR_DB_USER:-genro} -d ${GNR_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # The framework itself runs psql, pg_dump and pg_restore (dump/restore in the
  # postgres adapter), which the official image lacks. They are copied from the
  # postgres image the db already uses, so no extra download and the client
  # always matches the server. libpq comes along: psql 18 needs a newer one
  # than the image has. Wrappers scope it to these tools, so psycopg is
  # untouched. Runs on every start, so a POSTGRES_TAG change follows along.
  pgclient:
    image: postgres:${POSTGRES_TAG:-18}
    container_name: gnr-${GNR_PROJECT}-pgclient
    hostname: gnr-${GNR_PROJECT}-pgclient
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Debian-based tags only: Alpine ones have no *-linux-gnu libpq, and
        # their musl binaries would not run in the app image anyway.
        if ! ls /usr/lib/*-linux-gnu/libpq.so.5 >/dev/null 2>&1; then
          echo "[pgclient] ERROR: POSTGRES_TAG '${POSTGRES_TAG:-18}' is not Debian-based (alpine?): use e.g. 18 or 17-bookworm" >&2
          exit 1
        fi
        rm -rf /pgclient/* && mkdir -p /pgclient/bin /pgclient/libexec /pgclient/lib
        src=$$(ls -d /usr/lib/postgresql/*/bin | tail -1)
        cp -P /usr/lib/*-linux-gnu/libpq.so.5* /pgclient/lib/
        for t in psql pg_dump pg_restore pg_dumpall pg_isready; do
          cp "$$src/$$t" /pgclient/libexec/
          printf '#!/bin/sh\nLD_LIBRARY_PATH=/opt/pgclient/lib exec /opt/pgclient/libexec/%s "$$@"\n' "$$t" > "/pgclient/bin/$$t"
          chmod 755 "/pgclient/bin/$$t"
        done
        echo "[pgclient] $$("$$src/psql" --version)"
    volumes:
      - pgclient:/pgclient

  app:
    # The official image, used as it is: everything dev-specific is mounted
    # from docker/ and set up by the entrypoint at runtime.
    image: ghcr.io/genropy/genropy:${GENROPY_TAG:-latest}
    # The entrypoint starts as root (the image default), creates a user with the
    # host uid/gid and drops to it: see docker/entrypoint.sh.
    entrypoint: ["/opt/gnrdev/entrypoint.sh"]
    command: ["supervisord", "-c", "/opt/gnrdev/supervisor/supervisord.conf"]
    container_name: gnr-${GNR_PROJECT}-app
    hostname: gnr-${GNR_PROJECT}-app
    # service_healthy means pg_isready succeeds, so the app never has to wait
    # for the database itself.
    depends_on:
      db:
        condition: service_healthy
      pgclient:
        condition: service_completed_successfully
    environment:
      # --- project identity ---
      GNR_PROJECT: ${GNR_PROJECT}
      GNR_INSTANCE: ${GNR_INSTANCE}
      GNR_DEP_PROJECTS: ${GNR_DEP_PROJECTS:-}
      # Used by supervisor for `gnr web serve -p`
      GNR_PORT_WEB: ${GNR_PORT_WEB}

      # --- Genropy config ---
      GENRO_GNRFOLDER: /home/genro/.gnr
      # Prepended to the project paths (pathresolver.py:61), so the current
      # project wins. Note: the official image sets GNRLOCAL_PROJECTS (no
      # underscore), which nothing reads — this is the name the code uses.
      GNR_LOCAL_PROJECTS: /home/genro/genropy_projects/${GNR_PROJECT}
      GNR_LOGLEVEL: ${GNR_LOGLEVEL:-info}

      # --- database ---
      GNR_DB_IMPLEMENTATION: ${GNR_DB_IMPLEMENTATION:-postgres}
      GNR_DB_HOST: db
      GNR_DB_PORT: "5432"
      GNR_DB_NAME: ${GNR_DB_NAME}
      GNR_DB_USER: ${GNR_DB_USER:-genro}
      GNR_DB_PASSWORD: ${GNR_DB_PASSWORD:-genro}

      # --- application ---
      # All defaulted inline: an undefined {GNR_*} placeholder would silently
      # break config interpolation.
      GNR_ROOTPWD: ${GNR_ROOTPWD:-admin}
      GNR_MAINPACKAGE: ${GNR_MAINPACKAGE:-}
      GNR_EXTERNALHOST: ${GNR_EXTERNALHOST:-http://localhost:${GNR_PORT_WEB}}
      GNR_LOCALE: ${GNR_LOCALE:-it_IT}

      # --- runtime user ---
      # The entrypoint runs the app as this uid/gid, so whatever it writes into
      # the bind mounts (instances, sites) belongs to the host user on Linux.
      HOST_UID: ${HOST_UID:-501}
      HOST_GID: ${HOST_GID:-20}
      HOME: /home/genro
      PYTHONUSERBASE: /home/genro/.local
      PATH: /home/genro/.local/bin:/opt/pgclient/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      XDG_CACHE_HOME: /home/genro/.local/.cache

      # --- development ---
      # No watchdog in the image, so Werkzeug's "auto" reloader is the stat one:
      # it polls mtimes, which works across the macOS bind mount.
      PYTHONUNBUFFERED: "1"
      # checkdep runs `pip install` without --user (gnrapp.py:1093); PIP_USER
      # redirects it to PYTHONUSERBASE, i.e. the per-project `pylibs` volume.
      PIP_USER: "1"
    volumes:
      - ./docker:/opt/gnrdev:ro
      - ./gnrfolder:/home/genro/.gnr:ro
      # Per-project trees when set in the project .env, the global ones otherwise.
      # HOST_GNREXTRA is optional: without it an empty volume stands in.
      - ${GNR_PROJECTS_DIR:-${HOST_PROJECTS}}:/home/genro/genropy_projects
      - ${GNR_EXTRA_DIR:-${HOST_GNREXTRA:-gnrextra}}:/home/genro/gnrextra_projects
      - pylibs:/home/genro/.local
      - pgclient:/opt/pgclient:ro
    # Same port inside and out, so the URL the framework logs is the real one.
    ports:
      - "${GNR_PORT_WEB}:${GNR_PORT_WEB}"
      - "${GNR_PORT_DEBUG}:5679"
    restart: unless-stopped
    stop_grace_period: 20s

  # debugpy binds to the app's loopback (serverwsgi.py:316), unreachable from
  # the host. This sidecar shares the app's network namespace, so it sees that
  # loopback, and forwards the port published by app (5679) to it. Started only
  # by `gnrdev debug`; it must be recreated whenever app restarts, because it
  # stays attached to the namespace of the old container.
  debugbridge:
    image: alpine/socat:latest
    container_name: gnr-${GNR_PROJECT}-debugbridge
    profiles: [debug]
    network_mode: "service:app"
    command: ["TCP-LISTEN:5679,fork,reuseaddr", "TCP:127.0.0.1:5678"]

volumes:
  pgdata:
  pylibs:
  gnrextra:
  pgclient:

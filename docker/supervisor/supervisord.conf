; Used instead of the image's /etc/supervisor/supervisord.conf, which is left
; alone: it also includes conf.d/genropy.conf, a bare `gnr web daemon` we do
; not want.
;
; The original declares serverurl for supervisorctl but no [unix_http_server],
; so the socket is never created and supervisorctl cannot reach supervisord —
; which `gnrdev debug` relies on.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /opt/gnrdev/supervisor/app.conf

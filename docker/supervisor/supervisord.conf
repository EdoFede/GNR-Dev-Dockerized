; Replaces the image's /etc/supervisor/supervisord.conf.
;
; The original declares serverurl for supervisorctl but no [unix_http_server],
; so the socket is never created and supervisorctl cannot reach supervisord —
; which `gnrdev debug` relies on.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf

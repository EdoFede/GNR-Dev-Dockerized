; Processes of the "app" container.
;
; daemon and serve MUST share a container: the client checks the sitedaemon PID
; with psutil.pid_exists() (siteregister_client.py:142), which is PID-namespace
; local.
;
; Logs go to the container's stdout/stderr (maxbytes=0 disables rotation), so
; `docker compose logs -f` shows everything.
;
; The port given to `serve` is the one published on the host, so the URL the
; framework logs is usable as-is. It has to be a CLI argument: GNR_WSGI_OPT_PORT
; does not work (dictExtract yields key 'PORT', the code compares with 'port').

[program:gnrdaemon]
command=gnr web daemon %(ENV_GNR_INSTANCE)s
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gnrserve]
command=gnr web serve %(ENV_GNR_INSTANCE)s -p %(ENV_GNR_PORT_WEB)s
priority=50
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Remote debugging bridge: debugpy listens on localhost:5678 inside the
; container, socat exposes it on 5679. Started on demand by `gnrdev debug`.
[program:debugbridge]
command=socat TCP-LISTEN:5679,fork,reuseaddr TCP:127.0.0.1:5678
priority=99
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

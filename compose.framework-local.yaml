# Applied by `--framework-local` (or GNR_FRAMEWORK_MODE=local).
#
# Runs the framework from the checkout on the host, bind-mounted read-write:
# edits made on the host take effect in the container immediately. Use it to
# work on the framework itself.
#
# The checkout is used as it is: no git operation is performed on it, so the
# host repository is never moved under your feet. To pin a branch or commit
# without touching the host, use `--framework-git` instead.

services:
  app:
    volumes:
      # Over the image copy: environment.xml already points here for the
      # static assets, so they follow the checkout too.
      - ${HOST_GENROPY}:/home/genro/genropy
    environment:
      # Ahead of site-packages, where the image installs its own copy of gnr.
      PYTHONPATH: /home/genro/genropy/gnrpy
      # Read by the entrypoint: editable install for the checkout's
      # dependencies, then a check that gnr is imported from the mount.
      GNR_FRAMEWORK_EDITABLE: "1"
